[package]
name = "NuraWallet"
version = "1.0.4"
edition = "2021"

[lib]
name = "app_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[build-dependencies]
tauri-build = { version = "2", features = [ ] }

[dependencies]
# `unstable` is what gates Tauri's multiwebview API. Without it `new Webview(...)` always fails and the
# browser falls back to an iframe — which explorers and most dApps refuse with `frame-ancestors`.
tauri = { version = "2", features = [ "tray-icon", "unstable" ] }

tauri-plugin-store = "2"
tauri-plugin-os = "2"

serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

# Single-instance has no mobile implementation, so it is scoped to the desktop targets — pulling it
# into the Android build would fail to compile.
#
# The filesystem plugin is desktop-only for a different reason: Android saves the recovery phrase
# through MediaStore (see ExportBridge.kt), which no webview can reach, so the plugin would be dead
# weight there and one more thing granted to a build that does not use it.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"

[profile.release]
lto = true
strip = true
debug = false
opt-level = 3
panic = "abort"
codegen-units = 1
