name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check the version against the tag
        env:
          TAGGED: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          NUMBER=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)

          if [ -z "$NUMBER" ]; then
            echo "::error::No version line was found in src-tauri/Cargo.toml, so the app would report no version of its own and the release would have nothing to check the tag against."
            exit 1
          fi

          echo "Cargo.toml declares $NUMBER."

          if [ "$TAGGED" = "true" ] && [ "$GITHUB_REF_NAME" != "v$NUMBER" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Cargo.toml declares $NUMBER, so this release would ship an app reporting a version the release is not. Bump Cargo.toml and retag."
            exit 1
          fi

  windows:
    name: windows (.exe)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build

      - name: Stage the installers
        shell: bash
        run: |
          mkdir -p release-files
          BUNDLE=src-tauri/target/release/bundle

          stage() {
            local name=$1
            shift
            if [ -e "$1" ]; then
              cp "$1" "release-files/$name"
            else
              echo "::warning::Nothing matched for $name, so it will be missing from this release."
            fi
          }

          stage "Nura-Wallet-Windows-x64-setup.exe" "$BUNDLE"/nsis/*-setup.exe
          ls -l release-files

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows
          if-no-files-found: error
          path: release-files

  linux:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux x86_64 (.deb / .rpm / .AppImage)
            artifact: linux-x86_64
            deb: amd64
            unix: x86_64
          - os: ubuntu-22.04-arm
            label: linux aarch64 (.deb / .rpm / .AppImage)
            artifact: linux-aarch64
            deb: arm64
            unix: aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential file libfuse2 \
            xdg-utils

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build

      - name: Stage the installers
        shell: bash
        run: |
          mkdir -p release-files
          BUNDLE=src-tauri/target/release/bundle

          stage() {
            local name=$1
            shift
            if [ -e "$1" ]; then
              cp "$1" "release-files/$name"
            else
              echo "::warning::Nothing matched for $name, so it will be missing from this release."
            fi
          }

          stage "Nura-Wallet-Linux-${{ matrix.deb }}.deb" "$BUNDLE"/deb/*.deb
          stage "Nura-Wallet-Linux-${{ matrix.unix }}.rpm" "$BUNDLE"/rpm/*.rpm
          stage "Nura-Wallet-Linux-${{ matrix.unix }}.AppImage" "$BUNDLE"/appimage/*.AppImage
          ls -l release-files

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: release-files

  macos:
    name: macos universal (.dmg)
    needs: version
    runs-on: macos-14
    timeout-minutes: 60

    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Require a certificate for a tagged build
        if: startsWith(github.ref, 'refs/tags/v') && env.APPLE_CERTIFICATE == ''
        run: |
          echo "::error::No APPLE_CERTIFICATE secret is set, so this release would ship a .dmg Gatekeeper refuses to open. Add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY to the repository secrets, plus APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID to notarize."
          exit 1

      - name: Warn when the bundle will be unsigned
        if: env.APPLE_CERTIFICATE == ''
        run: |
          echo "::warning::No APPLE_CERTIFICATE secret is set, so this .dmg is neither signed nor notarized and Gatekeeper will refuse it until the user right-clicks Open. Add APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY to sign, plus APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID to notarize."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # One bundle for both architectures: an Intel-only runner is the other way to reach x86_64 and
      # GitHub is retiring those, so the lipo'd binary is the one that keeps working.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run tauri build -- --target universal-apple-darwin

      - name: Stage the installers
        shell: bash
        run: |
          mkdir -p release-files
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle

          stage() {
            local name=$1
            shift
            if [ -e "$1" ]; then
              cp "$1" "release-files/$name"
            else
              echo "::warning::Nothing matched for $name, so it will be missing from this release."
            fi
          }

          stage "Nura-Wallet-macOS-universal.dmg" "$BUNDLE"/dmg/*.dmg
          ls -l release-files

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos
          if-no-files-found: error
          path: release-files

  android:
    name: android (.apk)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      NDK_VERSION: 29.0.13113456
      BUILD_TOOLS_VERSION: 36.0.0
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Require a keystore for a tagged build
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE == ''
        run: |
          echo "::error::No ANDROID_KEYSTORE secret is set, so this release would ship an APK nobody can install. Add ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to the repository secrets."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;$NDK_VERSION" "platforms;android-36" "build-tools;$BUILD_TOOLS_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Restore generated Android scaffolding
        run: npm run tauri android init

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE != ''
        working-directory: src-tauri/gen/android
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build the universal APK
        run: npm run tauri android build -- --apk

      - name: Build the per-ABI APKs
        run: npm run tauri android build -- --apk --split-per-abi

      - name: Remove the keystore
        if: always()
        working-directory: src-tauri/gen/android
        run: rm -f keystore.properties release.jks

      - name: Collect the APKs
        env:
          TAGGED: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          OUT=src-tauri/gen/android/app/build/outputs/apk
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          mkdir -p release-files

          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::No apksigner at $APKSIGNER, so nothing here can tell a signed APK from one nobody can install. Check that BUILD_TOOLS_VERSION matches what sdkmanager installed."
            exit 1
          fi

          for pair in universal:universal arm64:arm64-v8a arm:armeabi-v7a x86:x86 x86_64:x86_64; do
            flavor=${pair%%:*}
            abi=${pair##*:}
            apk=$(ls "$OUT/$flavor/release"/*.apk 2>/dev/null | head -1)

            if [ -z "$apk" ]; then
              echo "::error::No APK was produced for the $flavor flavour. Check that the $abi ABI is still one of the four RustPlugin.kt declares."
              exit 1
            fi

            if "$APKSIGNER" verify --print-certs "$apk"; then
              cp "$apk" "release-files/Nura-Wallet-Android-$abi.apk"
            elif [ "$TAGGED" = "true" ]; then
              echo "::error::The build produced an unsigned $abi APK despite a keystore being configured. Check that ANDROID_KEYSTORE is valid base64 and that the alias and passwords match it."
              exit 1
            else
              cp "$apk" "release-files/Nura-Wallet-Android-$abi-unsigned.apk"
              echo "::warning::The $abi APK is unsigned and cannot be installed. Set the ANDROID_KEYSTORE secrets."
            fi
          done
          ls -l release-files

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android
          if-no-files-found: error
          path: release-files

  ios:
    name: ios (.ipa)
    needs: version
    runs-on: macos-14
    timeout-minutes: 90

    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
      IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}

    steps:
      - name: Require an Apple team for a tagged build
        if: startsWith(github.ref, 'refs/tags/v') && env.APPLE_DEVELOPMENT_TEAM == ''
        run: |
          echo "::error::No APPLE_DEVELOPMENT_TEAM secret is set, so this release would carry no .ipa. Add APPLE_DEVELOPMENT_TEAM, IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD and IOS_MOBILE_PROVISION to the repository secrets."
          exit 1

      # Xcode enforces code signing on iOS, so the team is needed to write the project at all, not
      # only to sign the result: without it there is nothing an untagged run can usefully do. It
      # says so and stands down rather than failing a build the other four platforms are passing.
      - name: Look for an Apple team
        id: apple
        run: |
          if [ -z "$APPLE_DEVELOPMENT_TEAM" ]; then
            echo "::warning::No APPLE_DEVELOPMENT_TEAM secret is set. Xcode enforces code signing for iOS, so the project cannot even be generated without a team and this release will carry no .ipa. Add APPLE_DEVELOPMENT_TEAM, IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD and IOS_MOBILE_PROVISION to the repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.apple.outputs.ready == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.apple.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        if: steps.apple.outputs.ready == 'true'
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: steps.apple.outputs.ready == 'true'
        with:
          workspaces: src-tauri

      - name: Install dependencies
        if: steps.apple.outputs.ready == 'true'
        run: npm ci

      # gen/apple is not in the tree, the same way gen/android's generated half is not.
      - name: Restore generated iOS scaffolding
        if: steps.apple.outputs.ready == 'true'
        run: npm run tauri ios init

      - name: Build the IPA
        if: steps.apple.outputs.ready == 'true'
        run: npm run tauri ios build

      - name: Collect the IPA
        if: steps.apple.outputs.ready == 'true'
        run: |
          mkdir -p release-files
          IPA=$(find src-tauri/gen/apple -name '*.ipa' -type f | head -1)

          if [ -z "$IPA" ]; then
            echo "::error::The build produced no .ipa. Check that IOS_CERTIFICATE and IOS_MOBILE_PROVISION match the team in APPLE_DEVELOPMENT_TEAM, and that the provisioning profile covers io.nurawallet.ios."
            exit 1
          fi

          cp "$IPA" "release-files/Nura-Wallet-iOS-arm64.ipa"
          ls -l release-files

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.apple.outputs.ready == 'true'
        with:
          name: ios
          if-no-files-found: error
          path: release-files

  release:
    name: Attach to the release
    needs: [ windows, linux, macos, android, ios ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be attached
        run: |
          ls -lR artifacts
          COUNT=$(find artifacts -type f | wc -l)
          echo "$COUNT files staged for the release."

          if [ "$COUNT" -ne 14 ]; then
            echo "::warning::Expected 14 assets (1 Windows, 6 Linux, 1 macOS, 5 Android, 1 iOS) but found $COUNT. Check the staging warnings in the build jobs above; an iOS build with no Apple team configured stands down and accounts for exactly one of them."
          fi

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
