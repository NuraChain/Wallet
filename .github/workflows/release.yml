name: Release

# Pushing a version tag builds every platform and attaches the installers to the
# release for that tag. Can also be started by hand against any branch to check
# the build without publishing anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # The app is not at the repository root.
  APP_DIR: Application

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows (.exe / .msi)
            artifact: windows
          - os: ubuntu-22.04
            label: linux (.deb)
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on the lockfile-less install below, so the key uses Cargo.toml instead.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri

      # webkit2gtk is the webview Tauri renders into; the rest are what its bundler
      # needs to produce a .deb.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential file

      # `npm ci` needs a lockfile and package-lock.json is git-ignored in this repo,
      # so dependencies resolve fresh on every run.
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/deb/*.deb

  android:
    name: android (.apk)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;29.0.13113456" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      # Parts of src-tauri/gen/android are git-ignored because Tauri regenerates
      # them (buildSrc, tauri.settings.gradle, app/tauri.build.gradle.kts), and
      # without them Gradle cannot resolve the `rust` plugin.
      #
      # Verified locally that this leaves the hand-written files alone: MainActivity,
      # BrowserBridge and values/themes.xml came back byte-identical. It does drop
      # three unused files — .editorconfig, res/layout/activity_main.xml and a
      # values-night/themes.xml declaring `Theme.nura_wallet`, which is a different
      # style from the `@style/Theme` the manifest points at, so none of them affect
      # the build.
      - name: Restore generated Android scaffolding
        working-directory: ${{ env.APP_DIR }}
        run: npm run tauri android init

      - name: Build unsigned release APK
        working-directory: ${{ env.APP_DIR }}
        run: npm run tauri android build -- --apk

      # An unsigned APK cannot be installed, so it is signed here if a keystore is
      # configured. Without the secrets the job still produces the unsigned file
      # rather than failing outright.
      - name: Sign the APK
        id: sign
        if: ${{ secrets.ANDROID_KEYSTORE != '' }}
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: ${{ env.APP_DIR }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > release.jks
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          IN=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out nura-wallet.apk "$IN"
          "$BUILD_TOOLS/apksigner" verify --print-certs nura-wallet.apk
          rm -f release.jks

      - name: Stage the unsigned APK
        if: ${{ secrets.ANDROID_KEYSTORE == '' }}
        working-directory: ${{ env.APP_DIR }}
        run: cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk nura-wallet-unsigned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: ${{ env.APP_DIR }}/nura-wallet*.apk

  release:
    name: Attach to the release
    needs: [ desktop, android ]
    runs-on: ubuntu-latest
    # Only a tag produces a release; a manual run just leaves the artifacts on the run.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.msi
            artifacts/*.deb
            artifacts/*.apk
