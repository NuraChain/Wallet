name: Release

# Pushing a version tag builds every platform and attaches the installers to the
# release for that tag. Can also be started by hand against any branch to check
# the build without publishing anything.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # The app is not at the repository root.
  APP_DIR: Application

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows (.exe / .msi)
            artifact: windows
          - os: ubuntu-22.04
            label: linux (.deb)
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on the lockfile-less install below, so the key uses Cargo.toml instead.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri

      # webkit2gtk is the webview Tauri renders into; the rest are what its bundler
      # needs to produce a .deb.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential file

      # `npm ci` needs a lockfile and package-lock.json is git-ignored in this repo,
      # so dependencies resolve fresh on every run.
      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run tauri build

      # upload-artifact roots the archive at the common ancestor of every search
      # path it is given, not of the files actually matched. Listing nsis/, msi/
      # and deb/ together therefore rooted it at bundle/ and stored the installers
      # one directory down, so the release job's `artifacts/*.exe` globs matched
      # nothing and only the Android APK - uploaded from a single path, hence flat -
      # reached the release. Collecting into one directory keeps the archive flat.
      #
      # The directory must not be `dist`: that is Vite's build output, so staging
      # there uploaded index.html and the whole frontend bundle alongside the
      # installers, and index.html ended up attached to the release.
      - name: Stage the installers
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          mkdir -p release-files
          find src-tauri/target/release/bundle \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' \) \
            -exec cp {} release-files/ \;
          ls -l release-files

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ env.APP_DIR }}/release-files

  android:
    name: android (.apk)
    runs-on: ubuntu-latest

    # The `secrets` context is not available to a step's `if`, but job-level `env`
    # may read it and `env` is available there. This mapping is that bridge; without
    # it the signing step cannot ask whether a keystore was configured.
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      # Checked before anything is built: an unsigned APK cannot be installed, so
      # a tag that produces one is a wasted release. Failing here costs seconds
      # rather than discovering it twenty minutes later in the collect step.
      - name: Require a keystore for a tagged build
        if: startsWith(github.ref, 'refs/tags/v') && env.ANDROID_KEYSTORE == ''
        run: |
          echo "::error::No ANDROID_KEYSTORE secret is set, so this release would ship an APK nobody can install. Add ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD to the repository secrets."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;29.0.13113456" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      # Parts of src-tauri/gen/android are git-ignored because Tauri regenerates
      # them (buildSrc, tauri.settings.gradle, app/tauri.build.gradle.kts), and
      # without them Gradle cannot resolve the `rust` plugin.
      #
      # Verified locally that this leaves the hand-written files alone: MainActivity,
      # BrowserBridge and values/themes.xml came back byte-identical. It does drop
      # three unused files — .editorconfig, res/layout/activity_main.xml and a
      # values-night/themes.xml declaring `Theme.nura_wallet`, which is a different
      # style from the `@style/Theme` the manifest points at, so none of them affect
      # the build.
      - name: Restore generated Android scaffolding
        working-directory: ${{ env.APP_DIR }}
        run: npm run tauri android init

      # Gradle signs during the build when this file is present, which also gets the
      # APK zipaligned - apksigner alone does not align, and Android requires it.
      - name: Configure release signing
        if: env.ANDROID_KEYSTORE != ''
        working-directory: ${{ env.APP_DIR }}/src-tauri/gen/android
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: npm run tauri android build -- --apk

      # The keystore is deleted before anything else runs so it cannot reach an
      # artifact. A tag that got this far with a broken keystore still fails here:
      # the guard above only proves a secret was set, not that Gradle used it.
      - name: Collect the APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          OUT=src-tauri/gen/android/app/build/outputs/apk/universal/release
          APK=$(ls "$OUT"/*.apk | head -1)
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          rm -f src-tauri/gen/android/keystore.properties src-tauri/gen/android/release.jks
          mkdir -p release-files
          if "$APKSIGNER" verify --print-certs "$APK"; then
            cp "$APK" release-files/nura-wallet.apk
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "::error::The build produced an unsigned APK despite a keystore being configured. Check that ANDROID_KEYSTORE is valid base64 and that the alias and passwords match it."
            exit 1
          else
            cp "$APK" release-files/nura-wallet-unsigned.apk
            echo "::warning::APK is unsigned and cannot be installed. Set the ANDROID_KEYSTORE secrets."
          fi
          ls -l release-files

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: ${{ env.APP_DIR }}/release-files

  release:
    name: Attach to the release
    needs: [ desktop, android ]
    runs-on: ubuntu-latest
    # Only a tag produces a release; a manual run just leaves the artifacts on the run.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Every job stages exactly the files meant to ship, so the whole directory
      # is attached rather than a list of extensions that can silently miss one.
      - name: List what will be attached
        run: ls -lR artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
