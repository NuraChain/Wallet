name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_DIR: Application

jobs:
  desktop:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows (.exe / .msi)
            artifact: windows
          - os: ubuntu-22.04
            label: linux (.deb)
            artifact: linux

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential file

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: npm run tauri build

      - name: Stage the installers
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          mkdir -p release-files
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          BUNDLE=src-tauri/target/release/bundle
          for file in "$BUNDLE"/nsis/*-setup.exe; do
            [ -e "$file" ] && cp "$file" "release-files/Nura-Wallet-$VERSION-x64-setup.exe"
          done
          for file in "$BUNDLE"/msi/*.msi; do
            [ -e "$file" ] && cp "$file" "release-files/Nura-Wallet-$VERSION-x64.msi"
          done
          for file in "$BUNDLE"/deb/*.deb; do
            [ -e "$file" ] && cp "$file" "release-files/Nura-Wallet-$VERSION-amd64.deb"
          done
          ls -l release-files

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ env.APP_DIR }}/release-files

  android:
    name: android (signed APK + AAB)
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Require Android signing secrets for tagged releases
        if: startsWith(github.ref, 'refs/tags/v') && (env.ANDROID_KEYSTORE == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == '')
        run: |
          echo "::error::Android signing secrets are incomplete. Configure ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install "ndk;29.0.13113456" "platforms;android-36" "build-tools;36.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13113456" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm ci

      - name: Restore generated Android scaffolding
        working-directory: ${{ env.APP_DIR }}
        run: npm run tauri android init

      - name: Configure release signing
        if: env.ANDROID_KEYSTORE != ''
        working-directory: ${{ env.APP_DIR }}/src-tauri/gen/android
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}
        run: npm run tauri android build -- --apk

      - name: Build release AAB
        working-directory: ${{ env.APP_DIR }}
        run: npm run tauri android build -- --aab

      - name: Verify, collect and clean signing material
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | grep -E '/release/' | head -1)
          AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' | grep -E '/release|Release/' | head -1)
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          test -n "$APK" || { echo "::error::Release APK was not found"; exit 1; }
          test -n "$AAB" || { echo "::error::Release AAB was not found"; exit 1; }

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null

          mkdir -p release-files
          cp "$APK" "release-files/Nura-Wallet-$VERSION-universal.apk"
          cp "$AAB" "release-files/Nura-Wallet-$VERSION.aab"

          rm -f src-tauri/gen/android/keystore.properties src-tauri/gen/android/release.jks
          ls -lh release-files

      - name: Remove signing material on failure
        if: always()
        working-directory: ${{ env.APP_DIR }}/src-tauri/gen/android
        run: rm -f keystore.properties release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: ${{ env.APP_DIR }}/release-files

  release:
    name: Attach to the release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*
