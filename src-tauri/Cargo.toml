[package]
name = "NuraWallet"
version = "1.1.2"
edition = "2021"

[lib]
name = "app_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[build-dependencies]
tauri-build = { version = "2", features = [ ] }

[dependencies]
# `unstable` is what gates Tauri's multiwebview API. Without it `new Webview(...)` always fails and the
# browser falls back to an iframe — which explorers and most dApps refuse with `frame-ancestors`.
tauri = { version = "2", features = [ "tray-icon", "unstable" ] }

tauri-plugin-store = "2"
tauri-plugin-os = "2"

# How this app reads its own API endpoints — the explorers behind the history and token lists, the
# price feed, and the GoldRush fallback. The request is made by Rust, where there is no origin and no
# preflight, so none of that data depends on someone else's CORS header.
#
# Nura's explorer is why it was pulled in: it sends `Access-Control-Allow-Origin` twice, and a repeated
# header fails the CORS check exactly as hard as a missing one, so the wallet could not read its own
# chain's history from the webview at all. The rest followed because a header that answers the browser
# today can stop in a deploy nobody here is told about, and it fails looking like an empty account.
#
# Every host is named in the `http:default` scope of all three capability blocks, and no wildcard is
# granted: addresses the user types — custom RPCs and explorers, the browser tab — keep the webview.
tauri-plugin-http = "2"

serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

# Single-instance has no mobile implementation, so it is scoped to the desktop targets — pulling it
# into the Android build would fail to compile.
#
# The filesystem plugin is desktop-only for a different reason: Android saves the recovery phrase
# through MediaStore (see ExportBridge.kt), which no webview can reach, so the plugin would be dead
# weight there and one more thing granted to a build that does not use it.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"

[profile.release]
lto = true
strip = true
debug = false
opt-level = 3
panic = "abort"
codegen-units = 1
