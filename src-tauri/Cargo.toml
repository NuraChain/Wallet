[package]
name = "NuraWallet"
version = "1.7.5"
edition = "2021"

[lib]
name = "app_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[build-dependencies]
tauri-build = { version = "2", features = [ ] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon", "unstable" ] }

tauri-plugin-store = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-http = "2"

serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = [ "deep-link" ] }
tauri-plugin-fs = "2"

tokio = { version = "1", features = [ "sync", "time" ] }

# Biometric unlock. Android keeps the password under a Keystore key that only a biometric opens (the plugin's
# cipher); iOS and macOS keep it in the Keychain behind Face ID or Touch ID (src/keychain.rs).
[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "macos"))'.dependencies]
tauri-plugin-biometric = "2.5"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
security-framework = { version = "3.7", features = [ "OSX_10_15" ] }

# Tauri stacks a window's webviews in one vertical box on Linux and takes no position for them, so
# src/stage.rs lays the browser's tabs out itself. The version is the one Tauri is built against.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# WebKitGTK keeps the camera from every page until it is switched on and answered for, which
# src/camera.rs does for the wallet's own webview. Again the version Tauri is built against.
webkit2gtk = "2.0"

[profile.release]
lto = true
strip = true
debug = false
opt-level = 3
panic = "abort"
codegen-units = 1
