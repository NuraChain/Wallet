[package]
name = "NuraWallet"
version = "1.1.2"
edition = "2021"

[lib]
name = "app_lib"
crate-type = [ "staticlib", "cdylib", "rlib" ]

[build-dependencies]
tauri-build = { version = "2", features = [ ] }

[dependencies]
# `unstable` is what gates Tauri's multiwebview API. Without it `new Webview(...)` always fails and the
# browser falls back to an iframe — which explorers and most dApps refuse with `frame-ancestors`.
tauri = { version = "2", features = [ "tray-icon", "unstable" ] }

tauri-plugin-store = "2"
tauri-plugin-os = "2"

# The one escape hatch from CORS. Every other request in this app goes through the webview's own
# `fetch` and is subject to the browser rules, which is the right default — this exists because Nura's
# explorer sends `Access-Control-Allow-Origin` twice and a repeated header fails the CORS check exactly
# as hard as a missing one, so the wallet cannot read its own chain's history without it. The request
# is made by Rust, where there is no origin and no preflight.
#
# It is scoped to that one host in every capability block; see the `http:default` entries there.
tauri-plugin-http = "2"

serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

# Single-instance has no mobile implementation, so it is scoped to the desktop targets — pulling it
# into the Android build would fail to compile.
#
# The filesystem plugin is desktop-only for a different reason: Android saves the recovery phrase
# through MediaStore (see ExportBridge.kt), which no webview can reach, so the plugin would be dead
# weight there and one more thing granted to a build that does not use it.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-fs = "2"

[profile.release]
lto = true
strip = true
debug = false
opt-level = 3
panic = "abort"
codegen-units = 1
